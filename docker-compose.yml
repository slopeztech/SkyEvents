# =============================================================================
# SkyEvents — docker-compose for local development
#
# Services:
#   db        → PostgreSQL 16
#   redis     → Redis 7
#   web       → Django development server
#   worker    → Celery worker
#   beat      → Celery beat scheduler
#   flower    → Celery monitoring UI (optional)
#
# Usage:
#   docker compose up -d
#   docker compose logs -f web
#   docker compose exec web python manage.py migrate
#   docker compose exec web python manage.py createsuperuser
# =============================================================================

version: "3.9"

# ---------------------------------------------------------------------------
# Named volumes for data persistence
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:
  media_files:

# ---------------------------------------------------------------------------
# Shared service configuration via YAML anchors
# ---------------------------------------------------------------------------
x-django-common: &django-common
  build:
    context: .
    dockerfile: Dockerfile
    target: development
    args:
      APP_ENV: development
  environment: &django-env
    DJANGO_SETTINGS_MODULE: config.settings.local
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-secret-key-change-this}
    DJANGO_DEBUG: "True"
    DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,web"
    DATABASE_URL: postgres://skyevents:skyevents@db:5432/skyevents
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/0
    LOG_LEVEL: DEBUG
    APP_LOG_LEVEL: DEBUG
  volumes:
    # Mount source code for hot reload
    - .:/app
    - media_files:/app/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # --- PostgreSQL -----------------------------------------------------------
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_DB: skyevents
      POSTGRES_USER: skyevents
      POSTGRES_PASSWORD: skyevents
      # Performance tuning for development
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyevents -d skyevents"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # --- Redis ----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command: >
      redis-server
        --appendonly yes
        --appendfsync everysec
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # --- Django web server ----------------------------------------------------
  web:
    <<: *django-common
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # --- Celery worker --------------------------------------------------------
  worker:
    <<: *django-common
    command: >
      celery -A config.celery worker
        --loglevel=info
        --concurrency=4
        --queues=default,media,notifications
        --hostname=worker@%h
    healthcheck:
      test: ["CMD-SHELL", "celery -A config.celery inspect ping -d worker@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # --- Celery beat (periodic tasks) -----------------------------------------
  beat:
    <<: *django-common
    command: >
      celery -A config.celery beat
        --loglevel=info
        --scheduler=django_celery_beat.schedulers:DatabaseScheduler
    # Only one beat instance should ever run — no replicas
    deploy:
      replicas: 1

  # --- Celery Flower (monitoring) -------------------------------------------
  flower:
    <<: *django-common
    command: >
      celery -A config.celery flower
        --port=5555
        --url-prefix=flower
    ports:
      - "5555:5555"
    profiles:
      # Only started when explicitly requested: docker compose --profile monitoring up
      - monitoring
